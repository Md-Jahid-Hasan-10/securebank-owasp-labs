server:
  port: 8080
  error:
    # FIXED: [A02-Lab4] / [A10-Lab23] Verbose stack traces are no longer returned to
    # the client. Django's DEBUG=True analogue. These exposed config values, file
    # paths and library versions on every unhandled error.
    include-stacktrace: never
    include-message: never
    include-exception: false

spring:
  application:
    name: securebank-core

  datasource:
    url: jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:securebank}
    username: ${DB_USER:securebank}
    password: ${DB_PASSWORD:securebank}
    hikari:
      maximum-pool-size: 10

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  thymeleaf:
    cache: false

  jackson:
    # FIXED: [A08-Lab20] Polymorphic default typing is disabled and is no longer
    # enabled anywhere in the application. The import endpoint parses into a fixed
    # target type with a plain ObjectMapper, so a document can never name the class
    # it wants instantiated.
    default-typing: disabled
    property-naming-strategy: SNAKE_CASE

# FIXED: [A04-Lab8] The JWT signing secret is no longer committed. It is read from the
# JWT_SECRET environment variable and there is no default: the application refuses to
# start when the variable is missing or shorter than 32 bytes.
#
# Generate a value with:
#   python3 -c "import secrets; print(secrets.token_hex(32))"
jwt:
  secret: ${JWT_SECRET}
  expiration-seconds: 3600

# FIXED: [A02-Lab6] The static resource directory is no longer the web root. Assets
# are served from a dedicated directory that contains no secrets, the dot-prefixed
# resource handlers are gone and the database backup is written outside the web
# root.
#
# FIXED: [A08-Lab22] The upload directory has moved out of the static tree as well.
# Uploads used to live in static/uploads and were mapped as a static resource
# handler, which meant anything a user uploaded was served back as if it were part
# of the site. They now live under data/, which is never packaged into the artifact
# and never mapped to a URL.
app:
  # The filesystem directory that holds static assets. Contains no secrets.
  asset-dir: ${APP_ASSET_DIR:static/assets}
  # Where uploaded files are written. Outside the web root, served only through the
  # authenticated download endpoint.
  upload-dir: ${APP_UPLOAD_DIR:data/uploads}

server.servlet:
  # exposed by the Lab 4 debug endpoint
  app:
    name: SecureBank Core
    internal-report-service: "http://report:8081"

logging:
  level:
    com.securebank: INFO
