server:
  port: 8081
  error:
    # FIXED: [A05-Lab12] the stack trace is no longer rendered into the response body.
    # include-stacktrace: always leaked file paths, library versions and the Spring
    # configuration to anyone who could trigger an error.
    include-stacktrace: never
    include-message: never
    include-exception: false

spring:
  application:
    name: securebank-report
  thymeleaf:
    cache: false
  jackson:
    property-naming-strategy: SNAKE_CASE

# FIXED: [A05-Lab12] Internal configuration values are no longer exposed through a
# template. The report template model carries only the account id and the service
# name; the configuration object is not reachable from it, and no user-supplied
# expression is evaluated at all.
report:
  secret-key: "sb-report-internal-secret-9f3a2c"
  db-path: "/var/lib/securebank/report-cache.db"
  internal-only: true
