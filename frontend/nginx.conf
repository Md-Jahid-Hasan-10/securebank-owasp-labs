server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: every unknown path falls through to index.html so that
    # deep links such as /banking/accounts/2 (Lab 1) and /lab/5 (Lab 5) resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Same-origin proxy to the Spring Boot API. Keeps the browser on one origin,
    # which is what the session-fixation lab (Lab 18) needs in order to send
    # a JSESSIONID cookie.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lab 6 - the exposed static files live in the backend's web root.
    location ~ ^/\.(env|git/) {
        proxy_pass http://backend:8080;
    }

    location ~ ^/backup\.zip$ {
        proxy_pass http://backend:8080;
    }

    location ~ ^/uploads/ {
        proxy_pass http://backend:8080;
    }
}
